name: Deploy tooling to VPS

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA from main to deploy (defaults to current main)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: carnokit-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Resolve the validated commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.commit }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            sha="${VALIDATED_SHA}"
          elif [[ -n "${REQUESTED_SHA}" ]]; then
            sha="${REQUESTED_SHA}"
          else
            sha="${DEFAULT_SHA}"
          fi
          [[ "${sha}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "A full 40-character commit SHA is required." >&2; exit 1; }
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Check out the deployment script
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/carnokit_deploy
          chmod 600 ~/.ssh/carnokit_deploy
          printf '%s\n' "${SSH_HOST_KEY}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy validated commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/carnokit_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "bash -s -- '${TARGET_SHA}'" < deploy/deploy-commit.sh
