# ARK: Survival Ascended - 4-map cluster
#
# Runs Aberration, Ragnarok, Genesis 1, and Lost Colony as
# clustered containers using the maintained mschnitzer/asa-linux-server image
# (Windows server binary via Proton). All tunables come from the sibling .env
# file.
#
# Start with:   docker compose -p asa-cluster up -d   (see 02-deploy-cluster.sh)
#
# Ports: game ports are published on all interfaces (players connect to
# UDP 7777-7780). RCON is published ONLY on 127.0.0.1 so the bot/watchdog
# can reach it locally - it is never exposed to the internet.
#
# NOTE: ServerAdminPassword is intentionally the LAST ?option. ARK reads a
# password value up to the next space, so any ?option placed after it gets
# folded into the password (an empty ?ServerPassword= will corrupt it). For a
# join password, set ServerPassword in each map's GameUserSettings.ini instead.

services:
  # One-shot init: fix ownership of the bind-mounted data dirs to the
  # in-container server user (uid/gid 25000). Runs before the servers.
  asa-permissions:
    image: alpine:3
    command:
      - sh
      - -c
      - |
        set -eu
        for srv in aberration ragnarok genesis lostcolony; do
          mkdir -p "/data/$${srv}/server-files" "/data/$${srv}/steam/compatibilitytools.d" "/data/$${srv}/steamcmd"
          chown -R 25000:25000 "/data/$${srv}"
        done
        mkdir -p /data/cluster-shared
        chown -R 25000:25000 /data/cluster-shared
    user: root
    volumes:
      - ${BASE_DIR}:/data
    restart: "no"

  asa-aberration:
    image: mschnitzer/asa-linux-server:latest
    container_name: asa-aberration
    hostname: asa-aberration
    entrypoint: "/usr/bin/start_server"
    user: gameserver
    tty: true
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      - ASA_START_PARAMS=Aberration_WP?listen?Port=${ABERRATION_GAME_PORT}?RCONPort=${ABERRATION_RCON_PORT}?RCONEnabled=True?MaxPlayers=${MAX_PLAYERS}?ServerAdminPassword=${ADMIN_PASSWORD} -WinLiveMaxPlayers=${MAX_PLAYERS} -clusterid=${CLUSTER_ID} -ClusterDirOverride="/home/gameserver/cluster-shared" -NoTransferFromFiltering -mods=${MODS} -NoBattlEye
      - ENABLE_DEBUG=0
    ports:
      - "0.0.0.0:${ABERRATION_GAME_PORT}:${ABERRATION_GAME_PORT}/udp"
      - "127.0.0.1:${ABERRATION_RCON_PORT}:${ABERRATION_RCON_PORT}/tcp"
    volumes:
      - ${BASE_DIR}/aberration/steam:/home/gameserver/Steam:rw
      - ${BASE_DIR}/aberration/steamcmd:/home/gameserver/steamcmd:rw
      - ${BASE_DIR}/aberration/server-files:/home/gameserver/server-files:rw
      - ${BASE_DIR}/cluster-shared:/home/gameserver/cluster-shared:rw
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      asa-permissions:
        condition: service_completed_successfully
    networks:
      - asa-network

  asa-ragnarok:
    image: mschnitzer/asa-linux-server:latest
    container_name: asa-ragnarok
    hostname: asa-ragnarok
    entrypoint: "/usr/bin/start_server"
    user: gameserver
    tty: true
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      - ASA_START_PARAMS=Ragnarok_WP?listen?Port=${RAGNAROK_GAME_PORT}?RCONPort=${RAGNAROK_RCON_PORT}?RCONEnabled=True?MaxPlayers=${MAX_PLAYERS}?ServerAdminPassword=${ADMIN_PASSWORD} -WinLiveMaxPlayers=${MAX_PLAYERS} -clusterid=${CLUSTER_ID} -ClusterDirOverride="/home/gameserver/cluster-shared" -NoTransferFromFiltering -mods=${MODS} -NoBattlEye
      - ENABLE_DEBUG=0
    ports:
      - "0.0.0.0:${RAGNAROK_GAME_PORT}:${RAGNAROK_GAME_PORT}/udp"
      - "127.0.0.1:${RAGNAROK_RCON_PORT}:${RAGNAROK_RCON_PORT}/tcp"
    volumes:
      - ${BASE_DIR}/ragnarok/steam:/home/gameserver/Steam:rw
      - ${BASE_DIR}/ragnarok/steamcmd:/home/gameserver/steamcmd:rw
      - ${BASE_DIR}/ragnarok/server-files:/home/gameserver/server-files:rw
      - ${BASE_DIR}/cluster-shared:/home/gameserver/cluster-shared:rw
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      asa-permissions:
        condition: service_completed_successfully
    networks:
      - asa-network

  asa-genesis:
    image: mschnitzer/asa-linux-server:latest
    container_name: asa-genesis
    hostname: asa-genesis
    entrypoint: "/usr/bin/start_server"
    user: gameserver
    tty: true
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      - ASA_START_PARAMS=Genesis_WP?listen?Port=${GENESIS_GAME_PORT}?RCONPort=${GENESIS_RCON_PORT}?RCONEnabled=True?MaxPlayers=${MAX_PLAYERS}?ServerAdminPassword=${ADMIN_PASSWORD} -WinLiveMaxPlayers=${MAX_PLAYERS} -clusterid=${CLUSTER_ID} -ClusterDirOverride="/home/gameserver/cluster-shared" -NoTransferFromFiltering -mods=${MODS} -NoBattlEye
      - ENABLE_DEBUG=0
    ports:
      - "0.0.0.0:${GENESIS_GAME_PORT}:${GENESIS_GAME_PORT}/udp"
      - "127.0.0.1:${GENESIS_RCON_PORT}:${GENESIS_RCON_PORT}/tcp"
    volumes:
      - ${BASE_DIR}/genesis/steam:/home/gameserver/Steam:rw
      - ${BASE_DIR}/genesis/steamcmd:/home/gameserver/steamcmd:rw
      - ${BASE_DIR}/genesis/server-files:/home/gameserver/server-files:rw
      - ${BASE_DIR}/cluster-shared:/home/gameserver/cluster-shared:rw
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      asa-permissions:
        condition: service_completed_successfully
    networks:
      - asa-network

  asa-lostcolony:
    image: mschnitzer/asa-linux-server:latest
    container_name: asa-lostcolony
    hostname: asa-lostcolony
    entrypoint: "/usr/bin/start_server"
    user: gameserver
    tty: true
    restart: unless-stopped
    stop_grace_period: 90s

    environment:
      - ASA_START_PARAMS=LostColony_WP?listen?Port=${LOSTCOLONY_GAME_PORT}?RCONPort=${LOSTCOLONY_RCON_PORT}?RCONEnabled=True?MaxPlayers=${MAX_PLAYERS}?ServerAdminPassword=${ADMIN_PASSWORD} -WinLiveMaxPlayers=${MAX_PLAYERS} -clusterid=${CLUSTER_ID} -ClusterDirOverride="/home/gameserver/cluster-shared" -NoTransferFromFiltering -mods=${MODS} -NoBattlEye
      - ENABLE_DEBUG=0

    ports:
      - "0.0.0.0:${LOSTCOLONY_GAME_PORT}:${LOSTCOLONY_GAME_PORT}/udp"
      - "127.0.0.1:${LOSTCOLONY_RCON_PORT}:${LOSTCOLONY_RCON_PORT}/tcp"

    volumes:
      - ${BASE_DIR}/lostcolony/steam:/home/gameserver/Steam:rw
      - ${BASE_DIR}/lostcolony/steamcmd:/home/gameserver/steamcmd:rw
      - ${BASE_DIR}/lostcolony/server-files:/home/gameserver/server-files:rw
      - ${BASE_DIR}/cluster-shared:/home/gameserver/cluster-shared:rw
      - /etc/localtime:/etc/localtime:ro

    depends_on:
      asa-permissions:
        condition: service_completed_successfully

    networks:
      - asa-network

networks:
  asa-network:
    name: asa-network
    driver: bridge
